[decontamination]
output_dir      = ../Run      ; directory containing the output_????? folders of the zoom run
fname           = results     ; base name: results_part, results_part_wide
output_zinit    = output_00001  ; initial (high-z) output
output_zlast    = output_00041  ; final (low-z) output
rbuffer         = 1.0

rvir            = 2.0     ; traceback sphere radius, in units of R200
rvir_track      = 0.25    ; particle-matching sphere used to follow the halo, in R200
rvir_search     = 5.0     ; halo search radius, in R200
rexclude        = 30.0    ; coarse particles coming within this radius [kpc] are contaminants
aexp_min        = 0.0     ; follow the halo down to this expansion factor
halo_num        = 1       ; target = most massive halo of the zoom
halo_cutoff     = 1.0e3
halo_massfrac   = 0.10
rank_function   = mass
tree_nleaves    = 100
plot            = true

; MUSIC domain shift of the zoom ICs ("Domain will be shifted by" in music.conf_log.txt),
; in units of levelmin cells
point_shift      = -37, 21, 24
point_shift_lmin = 7

; experimental diagnostics, off
rotation_curves = false
halo_dynamics   = false
lagrange_iords  = false
merger_tree     = false

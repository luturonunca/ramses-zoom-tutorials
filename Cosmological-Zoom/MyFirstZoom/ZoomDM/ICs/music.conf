[setup]
zstart        = 100
levelmin      = 7
levelmin_TF   = 8
levelmax      = 9
boxlength     = 25.0
padding       = 16
overlap       = 4
baryons       = no
periodic_TF   = yes
use_2LPT      = yes
region        = convex_hull
region_point_file = ../../Selection/results/music_zoom_2

[cosmology]
Omega_m       = 0.315
Omega_L       = 0.685
Omega_b       = 0.049
H0            = 67.4
sigma_8       = 0.811
nspec         = 0.965
transfer      = eisenstein

[random]
seed[7]       = 123456
seed[8]       = 23456
seed[9]       = 34567

[output]
format        = grafic2
filename      = ics_zoom_dm
ramses_nml    = yes

[poisson]
fft_fine      = yes
accuracy      = 1e-5
pre_smooth    = 3
post_smooth   = 3
smoother      = gs

[selection]
# Initial (high-z) and final (low-z) outputs of the parent run.
output_zinit = ../ParentBox/DarkMatterRun/output_00001
output_zlast = ../ParentBox/DarkMatterRun/output_00041

# Candidate halo mass range in Msol (Milky-Way-mass halos).
min_mass = 9e11
max_mass = 3e12

# Isolation: no neighbour heavier than max_mass_neighb * m_candidate within rbuffer.
max_mass_neighb = 0.6
# Isolation sphere radius in Mpc (physical).
rbuffer = 2.1
min_neighb = 0
max_neighb = 100000

# Radius (in R200) of the sphere whose particles are traced back to z_init.
rtb = 3.0

# Keep candidates away from the box edges (unit box coordinates).
boundary_min = 0.1
boundary_max = 0.9

# Base name for output files: results/music_zoom_N, results/music_zoom_analysis.pdf
fname = results/music_zoom

plot = True
plot_traceback = True
tree_nleaves = 100
full_analysis = False
create_halo_catalog = False

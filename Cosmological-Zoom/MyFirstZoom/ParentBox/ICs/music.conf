[setup]
zstart        = 100
levelmin      = 7
levelmax      = 7
boxlength     = 25.0
padding       = 0
overlap       = 0
baryons       = no
use_2LPT      = yes
periodic_TF   = yes

[cosmology]
Omega_m       = 0.315
Omega_L       = 0.685
Omega_b       = 0.049
H0            = 67.4
sigma_8       = 0.811
nspec         = 0.965
transfer      = eisenstein

[random]
seed[7]       = 123456

[output]
format        = grafic2
filename      = ic_box_dm
ramses_nml    = yes

[poisson]
fft_fine      = yes
accuracy      = 1e-5
